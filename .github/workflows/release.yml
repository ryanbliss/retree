name: Release

on:
    workflow_dispatch:

permissions:
    # contents: write so the release step can push the version tag and create
    # the GitHub release; id-token: write for npm trusted publishing.
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install latest npm for trusted publishing
              run: npm install -g npm@latest

            # Skip validation and publishing when every manifest version is
            # already on npm. The runtime family moves in lockstep; the ESLint
            # plugin is checked independently.
            - name: Check whether any package version needs publishing
              id: version
              run: |
                  LOCKSTEP_VERSION=$(node -p "require('./packages/retree-core/package.json').version")
                  echo "Lockstep version: ${LOCKSTEP_VERSION}"
                  LOCKSTEP_PUBLISH=false
                  for pkg in @retreejs/core @retreejs/query @retreejs/react @retreejs/devtools @retreejs/convex @retreejs/react-convex @retreejs/create; do
                      if npm view "${pkg}@${LOCKSTEP_VERSION}" version > /dev/null 2>&1; then
                          echo "${pkg}@${LOCKSTEP_VERSION} is already on npm."
                      else
                          echo "${pkg}@${LOCKSTEP_VERSION} is not on npm yet."
                          LOCKSTEP_PUBLISH=true
                      fi
                  done

                  ESLINT_PACKAGE=@retreejs/react-eslint-plugin
                  ESLINT_VERSION=$(node -p "require('./packages/retree-react-eslint-plugin/package.json').version")
                  echo "ESLint plugin version: ${ESLINT_VERSION}"
                  ESLINT_PUBLISH=false
                  if npm view "${ESLINT_PACKAGE}@${ESLINT_VERSION}" version > /dev/null 2>&1; then
                      echo "${ESLINT_PACKAGE}@${ESLINT_VERSION} is already on npm."
                  else
                      echo "${ESLINT_PACKAGE}@${ESLINT_VERSION} is not on npm yet."
                      ESLINT_PUBLISH=true
                  fi

                  PUBLISH=false
                  if [ "$LOCKSTEP_PUBLISH" = "true" ]; then
                      PUBLISH=true
                  fi
                  if [ "$ESLINT_PUBLISH" = "true" ]; then
                      PUBLISH=true
                  fi
                  echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
                  echo "lockstep_publish=${LOCKSTEP_PUBLISH}" >> "$GITHUB_OUTPUT"
                  echo "eslint_publish=${ESLINT_PUBLISH}" >> "$GITHUB_OUTPUT"
                  if [ "$PUBLISH" = "false" ]; then
                      echo "Every manifest version is already published; nothing to do."
                  fi

            - name: Install dependencies
              if: steps.version.outputs.publish == 'true'
              run: npm ci

            - name: Build packages
              if: steps.version.outputs.publish == 'true'
              run: npm run build:packages

            - name: Typecheck
              if: steps.version.outputs.publish == 'true'
              run: npm run typecheck

            - name: Test
              if: steps.version.outputs.publish == 'true'
              run: npm run test

            - name: Publish packages (lockstep, with provenance)
              if: steps.version.outputs.lockstep_publish == 'true'
              run: node scripts/publish-packages.mjs --provenance

            - name: Publish React ESLint plugin (with provenance)
              if: steps.version.outputs.eslint_publish == 'true'
              run: node scripts/publish-packages.mjs --package @retreejs/react-eslint-plugin --provenance

            # Tag and release only after npm publish succeeds, so a tag never
            # points at a version that failed to publish. Both steps are
            # idempotent: an existing release for the tag is left alone, so a
            # rerun after a partial failure converges.
            - name: Tag and create GitHub release (lockstep family)
              if: steps.version.outputs.lockstep_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/create-github-release.mjs

            - name: Tag and create GitHub release (React ESLint plugin)
              if: steps.version.outputs.eslint_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/create-github-release.mjs --package @retreejs/react-eslint-plugin
